name: Natspec Check

on: workflow_dispatch

jobs:
  natspec:
    name: Run Lintspec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: install-tools
        uses: ./.github/workflows/install-tools

      - name: Install and run Lintspec
        uses: beeb/lintspec@v0.6.0

  security-warning:
    name: Check Security Warning Natspec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Check security warning in contracts
        run: |
          WARNING='@custom:security WARNING: This contract has not been audited, may contain bugs, and should not be used to hold funds.'
          MISSING=()

          while IFS= read -r -d '' file; do
            if ! grep -q "$WARNING" "$file"; then
              MISSING+=("$file")
            fi
          done < <(find src/contracts -name '*.sol' -print0)

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::The following contracts are missing the required security warning natspec:"
            for file in "${MISSING[@]}"; do
              echo "::error file=$file::Missing: * $WARNING"
            done
            exit 1
          fi

          echo "All contracts contain the required security warning."
