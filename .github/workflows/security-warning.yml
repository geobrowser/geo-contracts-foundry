name: Security Warning Check

on: [push]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  security-warning:
    name: Check Security Warning Natspec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Check security warning in contracts
        run: |
          WARNING='@custom:security WARNING: This contract has not been audited, and may contain bugs.'
          MISSING=()

          while IFS= read -r -d '' file; do
            if ! grep -qF "$WARNING" "$file"; then
              MISSING+=("$file")
            fi
          done < <(find src/contracts -name '*.sol' -print0)

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::The following contracts are missing the required security warning natspec:"
            for file in "${MISSING[@]}"; do
              echo "::error file=$file::Missing: * $WARNING"
            done
            exit 1
          fi

          echo "All contracts contain the required security warning."
