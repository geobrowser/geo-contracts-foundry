[fmt]
line_length = 120
tab_width = 2
bracket_spacing = false
int_types = 'long'
quote_style = 'single'
number_underscore = 'thousands'
multiline_func_header = 'params_first_multi'
sort_imports = true

[profile.default]
solc_version = '0.8.30'
evm_version = 'prague'
libs = ['node_modules']
optimizer_runs = 10_000

[profile.optimized]
via_ir = true
out = 'out-via-ir'

[profile.test]
via_ir = true
out = 'out-via-ir'

[profile.docs]
src = 'src/interfaces/'

[fuzz]
runs = 1000

[invariant]
timeout = 100
depth = 128
show_metrics = true
fail_on_revert = true
corpus_dir = 'test/invariants/fuzz/corpus'
show_solidity = true

[rpc_endpoints]
arbitrum_one = "${ARBITRUM_ONE_RPC}"
arbitrum_testnet = "${ARBITRUM_TESTNET_RPC}"
geo_genesis = "${GEO_GENESIS_RPC}"
geo_testnet = "${GEO_TESTNET_RPC}"

[etherscan]
arbitrum = { key = "${ARBISCAN_API_KEY}" }
